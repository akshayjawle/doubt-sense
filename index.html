<body>


<header>

    <h1>Doubt<span>Sense</span></h1>

    <p>Student Portal</p>

</header>


<div class="container">


    <div class="hero">

        <h2>Ask. Learn. Understand.</h2>

        <p>
            Submit your academic doubt and get help from your teacher.
        </p>

    </div>


    <div class="card">

        <h3>Ask Your Doubt</h3>


        <form id="questionForm">

            <label>
                Subject
            </label>

            <select id="subject" required>

                <option value="">
                    Select Subject
                </option>

                <option value="Python">
                    Python
                </option>

                <option value="SQL">
                    SQL
                </option>

                <option value="Mathematics">
                    Mathematics
                </option>

                <option value="Data Science">
                    Data Science
                </option>

                <option value="Machine Learning">
                    Machine Learning
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>
                Your Doubt
            </label>

            <textarea
                id="question"
                placeholder="Type your question here..."
                required
            ></textarea>


            <button type="submit">
                Submit Doubt
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </form>

    </div>


    <div class="card">

        <h3>My Submitted Doubts</h3>

        <div id="questionsList">
            Loading...
        </div>

    </div>


</div>


<script>

const API_URL = "http://127.0.0.1:5000";


/* ================================
   SUBMIT QUESTION
================================ */

document
    .getElementById("questionForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const subject =
            document.getElementById("subject").value;

        const question =
            document.getElementById("question").value.trim();

        const message =
            document.getElementById("message");


        if (!subject || !question) {

            message.textContent =
                "Please select a subject and enter your doubt.";

            return;
        }


        message.textContent =
            "Submitting...";


        try {

            const response =
                await fetch(
                    API_URL + "/questions",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            subject: subject,
                            question: question
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error || "Submission failed"
                );
            }


            message.textContent =
                "Doubt submitted successfully! Priority: " +
                data.priority;


            document
                .getElementById("questionForm")
                .reset();


            loadQuestions();

        }


        catch (error) {

            console.error(error);

            message.textContent =
                "Error: " + error.message;

        }

    });


/* ================================
   LOAD QUESTIONS
================================ */

async function loadQuestions() {

    const list =
        document.getElementById("questionsList");


    try {

        const response =
            await fetch(
                API_URL + "/api/questions"
            );


        if (!response.ok) {
            throw new Error("Could not load questions");
        }


        const questions =
            await response.json();


        if (questions.length === 0) {

            list.innerHTML =
                "<p>No doubts submitted yet.</p>";

            return;
        }


        list.innerHTML = "";


        questions.forEach(function(q) {


            const div =
                document.createElement("div");

            div.className = "question";


            const header =
                document.createElement("div");

            header.className =
                "question-header";


            const subject =
                document.createElement("div");

            subject.className =
                "subject";

            subject.textContent =
                q.subject;


            const priority =
                document.createElement("div");

            priority.className =
                "priority priority-" +
                (q.priority || "low");

            priority.textContent =
                q.priority || "low";


            header.appendChild(subject);
            header.appendChild(priority);


            const text =
                document.createElement("p");

            text.textContent =
                q.question;


            div.appendChild(header);
            div.appendChild(text);


            /* Teacher answer */

            if (q.answer) {

                const answer =
                    document.createElement("div");

                answer.className =
                    "teacher-answer";


                const title =
                    document.createElement("div");

                title.className =
                    "teacher-answer-title";

                title.textContent =
                    "✓ Teacher Answer";


                const answerText =
                    document.createElement("div");

                answerText.textContent =
                    q.answer;


                answer.appendChild(title);
                answer.appendChild(answerText);


                div.appendChild(answer);

            }

            else {

                const waiting =
                    document.createElement("div");

                waiting.className =
                    "waiting";

                waiting.textContent =
                    "Waiting for teacher's answer...";


                div.appendChild(waiting);

            }


            list.appendChild(div);

        });

    }


    catch (error) {

        console.error(error);

        list.innerHTML =
            "<p>Unable to connect to backend.</p>";

    }

}


loadQuestions();


// Refresh every 5 seconds

setInterval(
    loadQuestions,
    5000
);

</script>


</body>

</html>
