```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DoubtSense - Teacher Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        header span {
            color: #60a5fa;
        }

        header p {
            color: #d1d5db;
        }

        .container {
            width: 85%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .hero {
            margin-bottom: 30px;
        }

        .hero h2 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .hero p {
            color: #6b7280;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .stat-card h3 {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 30px;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .card h3 {
            margin-bottom: 20px;
        }

        .question {
            border: 1px solid #e5e7eb;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #f9fafb;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .subject {
            color: #2563eb;
            font-weight: bold;
        }

        .priority {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .priority-high {
            background: #fee2e2;
            color: #b91c1c;
        }

        .priority-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .priority-low {
            background: #dcfce7;
            color: #166534;
        }

        .question-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .question-info {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .answer-box {
            margin-top: 15px;
            border-top: 1px solid #e5e7eb;

        .answer-box textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;

        }

    </style>

</head>


<body>


<header>

    <h1>Doubt<span>Sense</span></h1>

    <p>Teacher Dashboard</p>

</header>


<div class="container">


    <div class="hero">

        <h2>Teacher Dashboard</h2>

        <p>
            View student doubts and answer the highest-priority questions first.
        </p>

    </div>


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">

            <h3>Total Doubts</h3>

            <div class="number" id="totalQuestions">
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>High Priority</h3>

            <div class="number" id="highQuestions">
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>Unanswered</h3>

            <div class="number" id="unansweredQuestions">
                0
            </div>

        </div>

    </div>


    <!-- QUESTIONS -->

    <div class="card">

        <h3>
            Student Doubts
        </h3>


        <button
            class="refresh-button"
            onclick="loadQuestions()"
        >
            Refresh Questions
        </button>


        <div id="questionsList">

            <div class="empty">
                Loading questions...
            </div>

        </div>

    </div>


</div>


<script>

const API_URL = "https://doubt-sense.onrender.com";


// ========================================
// LOAD QUESTIONS
// ========================================

async function loadQuestions() {

    const questionsList =
        document.getElementById("questionsList");


    try {

        const response =
            await fetch(
                API_URL + "/api/questions"
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load questions."
            );

        }


        const questions =
            await response.json();


        // Statistics

        const total =
            questions.length;


        const high =
            questions.filter(
                q => q.priority === "high"
            ).length;


        const unanswered =
            questions.filter(
                q => q.status === "unanswered"
            ).length;


        document.getElementById(
            "totalQuestions"
        ).textContent = total;


        document.getElementById(
            "highQuestions"
        ).textContent = high;


        document.getElementById(
            "unansweredQuestions"
        ).textContent = unanswered;


        // No questions

        if (questions.length === 0) {

            questionsList.innerHTML =
                '<div class="empty">' +
                'No student doubts submitted yet.' +
                '</div>';

            return;

        }


        // Sort High → Medium → Low

        const priorityOrder = {
            high: 1,
            medium: 2,
            low: 3
        };


        questions.sort(function(a, b) {

            return (
                (priorityOrder[a.priority] || 3) -
                (priorityOrder[b.priority] || 3)
            );

        });


        questionsList.innerHTML = "";


        // Display questions

        questions.forEach(function(question) {

            const questionDiv =
                document.createElement("div");

            questionDiv.className =
                "question";


            // Header

            const headerDiv =
                document.createElement("div");

            headerDiv.className =
                "question-header";


            const subjectDiv =
                document.createElement("div");

            subjectDiv.className =
                "subject";

            subjectDiv.textContent =
                question.subject;


            const priorityDiv =
                document.createElement("div");

            priorityDiv.className =
                "priority";


            const priority =
                question.priority || "low";


            priorityDiv.textContent =
                priority;


            priorityDiv.classList.add(
                "priority-" + priority
            );


            headerDiv.appendChild(
                subjectDiv
            );

            headerDiv.appendChild(
                priorityDiv
            );


            // Question text

            const questionText =
                document.createElement("div");

            questionText.className =
                "question-text";

            questionText.textContent =
                question.question;


            // Information

            const infoDiv =
                document.createElement("div");

            infoDiv.className =
                "question-info";

            infoDiv.textContent =
                "Votes: " +
                (question.votes || 0) +
                " | Status: " +
                (question.status || "unanswered");


            questionDiv.appendChild(
                headerDiv
            );

            questionDiv.appendChild(
                questionText
            );

            questionDiv.appendChild(
                infoDiv
            );


            // --------------------------------
            // EXISTING ANSWER
            // --------------------------------

            if (question.answer) {

                const answerDiv =
                    document.createElement("div");

                answerDiv.className =
                    "existing-answer";


                const answerTitle =
                    document.createElement("strong");

                answerTitle.textContent =
                    "Teacher Answer";


                const answerText =
                    document.createElement("div");

                answerText.textContent =
                    question.answer;


                answerDiv.appendChild(
                    answerTitle
                );

                answerDiv.appendChild(
                    answerText
                );


                questionDiv.appendChild(
                    answerDiv
                );

            }


            // --------------------------------
            // ANSWER FORM
            // --------------------------------

            if (!question.answer) {

                const answerBox =
                    document.createElement("div");

                answerBox.className =
                    "answer-box";


                const textarea =
                    document.createElement("textarea");

                textarea.placeholder =
                    "Write your answer to the student...";


                const answerButton =
                    document.createElement("button");

                answerButton.className =
                    "answer-button";

                answerButton.textContent =
                    "Submit Answer";


                answerButton.onclick =
                    function() {

                        submitAnswer(
                            question.id,
                            textarea,
                            answerButton
                        );

                    };


                answerBox.appendChild(
                    textarea
                );

                answerBox.appendChild(
                    answerButton
                );


                questionDiv.appendChild(
                    answerBox
                );

            }


            questionsList.appendChild(
                questionDiv
            );

        });

    }


    catch (error) {

        console.error(
            "Loading error:",
            error
        );


        questionsList.innerHTML =
            '<div class="empty">' +
            'Unable to connect to DoubtSense backend.' +
            '</div>';

    }

}


// ========================================
// SUBMIT TEACHER ANSWER
// ========================================

async function submitAnswer(
    questionId,
    textarea,
    button
) {

    const answer =
        textarea.value.trim();


    if (!answer) {

        alert(
            "Please write an answer first."
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Submitting...";


    try {

        const response =
            await fetch(
                API_URL +
                "/questions/" +
                questionId +
                "/answer",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        answer: answer
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to submit answer."
            );

        }


        alert(
            "Answer submitted successfully!"
        );


        // Reload dashboard

        loadQuestions();

    }


    catch (error) {

        console.error(
            "Answer error:",
            error
        );


        alert(
            "Unable to submit answer."
        );


        button.disabled = false;

        button.textContent =
            "Submit Answer";

    }

}


// Load questions when page opens

loadQuestions();

</script>


</body>

</html>
